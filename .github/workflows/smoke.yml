name: CNC Pro Tools checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application scripts and UI
        run: |\n          node tests/smoke.test.js\n          node tests/calculations.test.js
          node tests/quotes.test.js
