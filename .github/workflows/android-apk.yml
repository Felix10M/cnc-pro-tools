name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK using runner tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate launcher icon from original CNC Pro SVG
        run: |
          python -m pip install --quiet cairosvg
          mkdir -p android-app/app/src/main/res/drawable-nodpi
          python -c "import cairosvg; cairosvg.svg2png(url='favicon.svg',write_to='android-app/app/src/main/res/drawable-nodpi/cnc_pro_icon.png',output_width=512,output_height=512)"
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: CNC-Pro-Tools-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CNC-Pro-Tools-Play-Unsigned-AAB
          path: android-app/app/build/outputs/bundle/release/app-release.aab
